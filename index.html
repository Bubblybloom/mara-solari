<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mara Solari</title>
</head>
<body>
    <header>
        <img src="images/MS-logo.PNG" alt="Monogram logo featuring the artist's initials in terracotta" width="50px">
        <ul class="header-links">
            <li><a href="https://github.com/Bubblybloom/mara-solari">About</a></li>
            <li><a href="https://github.com/Bubblybloom/mara-solari">Work</a></li>
            <li><a href="https://github.com/Bubblybloom/mara-solari">Contact</a></li>
        </ul>
    </header>
    <div class="hero">
        <div class="hero-text">
            <h1>Art made of memory, body & belonging.</h1>
            <h4>MARA SOLARI / VISUAL ARTIST</h4>
            <button>VIEW THE WORK</button>
        </div>
        <img src="images/hero-img.PNG" alt="Woman standing in front of a painting in an Art Gallery" width="300px" height="200px">
    </div>
    <div class="cards-container">
        <h2>SELECTED WORKS</h2>
        <div class="cards">
            <figure>
                <img src="images/fig-one.PNG" alt="Oil painting in earthy tones of a seated woman with her head resting on her shoulder." width="150px" height="150px">
                <figcaption>The Weight of Summer . Oil in canvas . 2026</figcaption>
            </figure>
            <figure>
                <img src="images/fig-two.PNG" alt="An oil painting in earthy tones of a woman seated at a table, resting on her elbows in a meditative pose." width="150px" height="150px">
                <figcaption>Quiet Geometry . Oil in canvas . 2026</figcaption>
            </figure>
            <figure>
                <img src="images/fig-three.PNG" alt="An oil painting in earthy tones of a woman looking out the window in front of a cup of coffee, with a black cat beside her." width="150px" height="150px">
                <figcaption>After the Garden . Oil in Canvas . 2026</figcaption>
            </figure>
            <figure>
                <img src="images/fig-four.PNG" alt="Oil painting in earthy tones of a woman on a sofa, drinking coffee, with a dog beside her." width="150px" height="150px">
                <figcaption>Things we Carry . Oil in canvas . 2026</figcaption>
            </figure>
        </div>
    </div>
    <div class="quote">
        <p>I paint the things we carry long after we have forgotten their names.</p>
        <p>Mara Solari</p>
    </div>
    <div class="cta-container">
        <p>View the collection</p>
        <h4>Some text... bla bla... i`ll decide later</h4>
        <button>Sign up</button>
    </div>
    <footer> Copiright © 2026 The Odin Project.</footer>
    

    
</body>
</html>
